# Cloudflare Pages config for the ATLAS GES site (Ahsen's private CF account).
# Static export in out/ + Pages Functions in functions/. Deploy with:
#   ATLAS_NOINDEX=1 npm run build && npx wrangler pages deploy out --project-name atlas-ges --branch <branch>
# No secrets in this file. IP_HASH_SALT is a Pages secret.
name = "atlas-ges"
pages_build_output_dir = "out"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "atlas-ges-db"
database_id = "0cceb845-a3c0-438e-bfe5-d564d448f0ec"
migrations_dir = "migrations"
